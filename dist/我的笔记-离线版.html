<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-layout="minimal" data-list="grid">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>我的笔记 · 离线版</title>
<meta name="description" content="纯前端个人笔记站：笔记本库、全文检索、封面卡片、知识图谱，手机/平板/电脑都能看。">
<meta name="theme-color" content="#FBFAF7">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23EA5A47'/><path d='M9 23V9h2.6l4.4 7 4.4-7H23v14h-2.6v-9.2L16 20.6l-4.4-6.8V23z' fill='white'/></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23EA5A47'/></svg>">
<!-- 离线版不含 KaTeX：公式会降级为等宽文本，内容不丢 -->
<style>
/* ============================================================
   笔记站样式 v2 —— 资料库 / 笔记本 的界面语言
   结构：左侧书架 + 右侧资料库网格 + 笔记正文
   皮肤：极简（暖白纸感）· 技术（冷灰 + 等宽）· 杂志（衬线 + 卡片）
   主题：浅色 / 深色 / 跟随系统
   ============================================================ */

/* ---------- 基础变量（极简 · 浅色） ---------- */
:root {
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB",
    "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", sans-serif;
  --font-serif: Georgia, "Songti SC", "Noto Serif CJK SC", "Source Han Serif SC", "SimSun", serif;
  --font-mono: "SF Mono", "JetBrains Mono", Menlo, Consolas, "Cascadia Code", "Courier New", monospace;

  /* 暖白纸感底 + 墨色字 */
  --bg: #FBFAF7;
  --bg-soft: #F4F2ED;
  --bg-elev: #FFFFFF;
  --bg-code: #F5F4F0;
  --paper: #FFFFFF;
  --text: #2B2723;
  --text-soft: #6B635A;
  --text-faint: #9A9188;
  --line: #E9E5DE;
  --line-strong: #DCD6CC;
  --accent: #EA5A47;
  --accent-soft: #FDEDEA;
  --accent-text: #C6432F;
  --mark: #FFF0A8;
  --shadow-card: 0 1px 2px rgba(43, 39, 35, .05), 0 6px 18px rgba(43, 39, 35, .06);
  --shadow-hover: 0 4px 10px rgba(43, 39, 35, .08), 0 16px 34px rgba(43, 39, 35, .10);
  --shadow-lg: 0 24px 60px rgba(30, 26, 22, .22);

  --radius: 18px;
  --radius-sm: 12px;
  --radius-xs: 9px;
  --sidebar-w: 268px;
  --toc-w: 216px;
  --content-max: 780px;
  --lh: 1.84;
  --fs: 16.5px;
  --heading-font: var(--font-sans);
  --article-bg: transparent;
  --article-pad: 0px;
  --card-thumb: 46px;

  --c-info: #3F6FD8;
  --c-tip: #12968A;
  --c-warn: #D2871C;
  --c-danger: #DC4C3F;
  --c-important: #8257E6;
  --c-todo: #78716C;
}

/* ---------- 深色 ---------- */
:root[data-theme="dark"] {
  --bg: #17150F;
  --bg-soft: #1F1C16;
  --bg-elev: #241F19;
  --bg-code: #201D17;
  --paper: #1E1B15;
  --text: #F2EDE6;
  --text-soft: #BBB2A6;
  --text-faint: #8B8276;
  --line: #302A22;
  --line-strong: #40382E;
  --accent: #FF7A5E;
  --accent-soft: #33231D;
  --accent-text: #FFA28D;
  --mark: #6B5A00;
  --shadow-card: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 22px rgba(0, 0, 0, .32);
  --shadow-hover: 0 6px 16px rgba(0, 0, 0, .5), 0 18px 40px rgba(0, 0, 0, .45);
  --shadow-lg: 0 24px 60px rgba(0, 0, 0, .65);
  --c-info: #82A6FF;
  --c-tip: #2EC4B6;
  --c-warn: #F0B429;
  --c-danger: #FF6B6B;
  --c-important: #B391FF;
}

/* ---------- 皮肤二：技术 ---------- */
:root[data-layout="tech"] {
  --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  --heading-font: var(--font-mono);
  --bg: #F7F8FA;
  --bg-soft: #EFF1F4;
  --bg-elev: #FFFFFF;
  --bg-code: #F1F3F6;
  --paper: #FFFFFF;
  --text: #161B22;
  --text-soft: #57606A;
  --text-faint: #8C959F;
  --line: #E3E6EA;
  --line-strong: #D0D7DE;
  --accent: #0F9D77;
  --accent-soft: #E6F7F1;
  --accent-text: #0A7D5F;
  --radius: 10px;
  --radius-sm: 8px;
  --radius-xs: 6px;
  --lh: 1.76;
  --content-max: 830px;
}
:root[data-theme="dark"][data-layout="tech"] {
  --bg: #101418;
  --bg-soft: #161B21;
  --bg-elev: #1A2027;
  --bg-code: #171D24;
  --paper: #171D24;
  --text: #E6EDF3;
  --text-soft: #9BA6B2;
  --text-faint: #6E7781;
  --line: #232A32;
  --line-strong: #303841;
  --accent: #2EE6A8;
  --accent-soft: #10322A;
  --accent-text: #2EE6A8;
}

/* ---------- 皮肤三：杂志 ---------- */
:root[data-layout="magazine"] {
  --font-sans: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
  --font-serif: "Songti SC", "Noto Serif CJK SC", Georgia, serif;
  --heading-font: var(--font-serif);
  --bg: #FBF9F6;
  --bg-soft: #F3EFE8;
  --bg-elev: #FFFFFF;
  --paper: #FFFFFF;
  --accent: #D97706;
  --accent-soft: #FDF3E3;
  --accent-text: #B45309;
  --radius: 22px;
  --radius-sm: 14px;
  --lh: 1.95;
  --fs: 17.5px;
  --content-max: 720px;
  --article-bg: var(--paper);
  --article-pad: 46px;
}
:root[data-theme="dark"][data-layout="magazine"] {
  --bg: #1A1712;
  --bg-soft: #221E18;
  --accent: #FFA94D;
  --accent-soft: #3A2A16;
  --accent-text: #FFC078;
}

/* ---------- 重置 ---------- */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  font-size: var(--fs);
  line-height: var(--lh);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
a { color: var(--accent-text); text-decoration: none; }
a:hover { text-decoration: none; }
button { font: inherit; color: inherit; cursor: pointer; }
img { max-width: 100%; height: auto; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

/* ============================ 骨架 ============================ */
.app { display: grid; grid-template-columns: var(--sidebar-w) minmax(0, 1fr); min-height: 100vh; }

/* ---------- 侧栏 / 书架 ---------- */
.sidebar {
  background: var(--bg-soft);
  border-right: 1px solid var(--line);
  display: flex; flex-direction: column;
  height: 100vh; position: sticky; top: 0; min-width: 0;
}
.sidebar-head { padding: 18px 16px 12px; }
.app-mark { display: flex; align-items: center; gap: 11px; color: inherit; }
.app-mark-icon {
  width: 38px; height: 38px; border-radius: 11px; flex: none; font-size: 19px;
  display: grid; place-items: center;
  background: var(--bg-elev); border: 1px solid var(--line);
  box-shadow: var(--shadow-card);
}
.app-mark-text { min-width: 0; display: flex; flex-direction: column; }
.app-mark-title { font-weight: 700; font-size: 15.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.app-mark-sub { font-size: 11.5px; color: var(--text-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.side-actions { padding: 0 14px 12px; display: flex; flex-direction: column; gap: 9px; }
.btn-new {
  display: flex; align-items: center; justify-content: center; gap: 6px;
  width: 100%; padding: 10px 14px; border: 0; border-radius: var(--radius-sm);
  background: var(--accent); color: #fff; font-size: 14px; font-weight: 600;
  box-shadow: 0 2px 8px color-mix(in srgb, var(--accent) 35%, transparent);
  transition: transform .12s, box-shadow .15s, filter .15s;
}
.btn-new:hover { filter: brightness(1.05); box-shadow: 0 4px 14px color-mix(in srgb, var(--accent) 42%, transparent); }
.btn-new:active { transform: scale(.985); }
.btn-new-plus { font-size: 17px; line-height: 1; }

.search { position: relative; }
.search-input {
  width: 100%; padding: 9px 32px 9px 32px;
  border: 1px solid var(--line-strong); border-radius: 11px;
  background: var(--bg-elev); color: var(--text); font-size: 13.5px;
  transition: border-color .15s, box-shadow .15s;
}
.search-input::placeholder { color: var(--text-faint); }
.search-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.search-icon { position: absolute; left: 11px; top: 50%; transform: translateY(-52%); color: var(--text-faint); pointer-events: none; font-size: 14px; }
.search-clear {
  position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
  border: 0; background: transparent; color: var(--text-faint); display: none; padding: 2px 5px; border-radius: 6px;
}
.search-clear.on { display: block; }
.search-clear:hover { background: var(--bg-soft); }

.side-scroll { flex: 1; overflow-y: auto; padding: 2px 10px 22px; overscroll-behavior: contain; }
.shelf { margin-bottom: 16px; }
.shelf-title {
  display: flex; align-items: center; justify-content: space-between; gap: 6px;
  font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--text-faint);
  font-weight: 700; padding: 7px 8px 6px;
}
.shelf-title .shelf-count { font-weight: 500; letter-spacing: 0; text-transform: none; }

.note-item {
  display: flex; align-items: center; gap: 9px;
  padding: 7px 8px; border-radius: var(--radius-xs); color: var(--text);
  cursor: pointer; border: 1px solid transparent;
}
.note-item:hover { background: var(--bg-elev); }
.note-item.active { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 26%, transparent); }
.note-item .nb { width: 9px; height: 22px; border-radius: 3px; flex: none; background: var(--nb, var(--accent)); }
.note-item-body { min-width: 0; flex: 1; display: flex; flex-direction: column; }
.note-item-title {
  font-size: 13.5px; font-weight: 600; line-height: 1.4;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.note-item-meta { font-size: 11px; color: var(--text-faint); display: flex; gap: 7px; margin-top: 1px; }
.note-item .star { font-size: 11px; flex: none; }
.side-empty { padding: 22px 10px; color: var(--text-faint); font-size: 13px; text-align: center; line-height: 1.7; }

.side-foot {
  border-top: 1px solid var(--line); padding: 10px 14px;
  display: flex; align-items: center; justify-content: space-between;
  font-size: 11.5px; color: var(--text-faint);
}
.kbd { font-family: var(--font-mono); font-size: 10.5px; border: 1px solid var(--line-strong); border-radius: 5px; padding: 1px 4px; }

/* ---------- 顶栏 ---------- */
.main { min-width: 0; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: 0; z-index: 40;
  display: flex; align-items: center; gap: 10px;
  padding: 10px 20px; min-height: 58px;
  background: color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter: saturate(180%) blur(14px);
  border-bottom: 1px solid var(--line);
}
.topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.breadcrumb { font-size: 13px; color: var(--text-faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.breadcrumb b { color: var(--text); font-weight: 600; }
.topbar-right { display: flex; align-items: center; gap: 8px; flex: none; }

.icon-btn {
  border: 1px solid var(--line-strong); background: var(--bg-elev); color: var(--text-soft);
  width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; font-size: 14px;
  transition: all .15s; flex: none;
}
.icon-btn:hover { border-color: var(--accent); color: var(--accent-text); background: var(--accent-soft); }
.icon-btn.round { border-radius: 50%; }
#menuBtn { display: none; }

.segmented {
  display: flex; gap: 2px; padding: 3px;
  background: var(--bg-soft); border: 1px solid var(--line); border-radius: 11px;
}
.segmented button {
  border: 0; background: transparent; color: var(--text-soft);
  font-size: 13px; padding: 5px 13px; border-radius: 8px; white-space: nowrap;
  transition: background .15s, color .15s, box-shadow .15s;
}
.segmented button:hover { color: var(--text); }
.segmented button.on { background: var(--bg-elev); color: var(--text); font-weight: 600; box-shadow: var(--shadow-card); }
.segmented.tiny button { padding: 5px 9px; font-size: 13px; }

.content { flex: 1; min-width: 0; }
.view { display: none; }
.view.on { display: block; }

.progress-bar { position: fixed; top: 0; left: 0; height: 2px; background: var(--accent); width: 0; z-index: 100; transition: width .1s linear; }

/* ============================ 资料库 ============================ */
.lib { max-width: 1180px; margin: 0 auto; padding: 26px 26px 90px; }
.lib-head {
  display: flex; align-items: flex-end; justify-content: space-between; gap: 20px;
  flex-wrap: wrap; margin-bottom: 22px;
}
.lib-head-main h1 { font-size: 30px; margin: 0 0 6px; letter-spacing: -0.01em; font-family: var(--heading-font); }
.lib-sub { margin: 0; color: var(--text-soft); font-size: 14px; max-width: 62ch; }
.lib-stats { display: flex; gap: 8px; flex-wrap: wrap; }
.stat {
  background: var(--bg-elev); border: 1px solid var(--line); border-radius: 999px;
  padding: 6px 13px; font-size: 12.5px; color: var(--text-soft); white-space: nowrap;
}
.stat b { color: var(--text); font-size: 14px; margin-right: 4px; font-variant-numeric: tabular-nums; }

.shelf-strip { margin-bottom: 26px; }
.shelf-strip-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 11px; }
.shelf-strip-head h2 { font-size: 15.5px; margin: 0; font-family: var(--heading-font); letter-spacing: .01em; }
.shelf-strip-head .hint { font-size: 12px; color: var(--text-faint); }
.strip-scroll { display: flex; gap: 12px; overflow-x: auto; padding: 2px 2px 8px; scroll-snap-type: x proximity; }
.strip-scroll::-webkit-scrollbar { height: 8px; }
.strip-scroll::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 8px; }
.strip-scroll::-webkit-scrollbar-track { background: transparent; }

/* ---------- 笔记本卡片（网格） ---------- */
.grid-notes { display: grid; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); gap: 16px; }
.nb-card {
  position: relative; display: flex; flex-direction: column;
  background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 16px 16px 14px; color: inherit; overflow: hidden;
  box-shadow: var(--shadow-card);
  transition: transform .18s cubic-bezier(.22,.8,.3,1), box-shadow .18s, border-color .18s;
  scroll-snap-align: start;
}
.nb-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-hover); border-color: color-mix(in srgb, var(--nb, var(--accent)) 30%, var(--line)); }
.nb-card::before {
  content: ""; position: absolute; inset: 0 0 auto 0; height: 4px;
  background: linear-gradient(90deg, var(--nb, var(--accent)), color-mix(in srgb, var(--nb, var(--accent)) 45%, transparent));
}
.nb-card-top { display: flex; align-items: center; gap: 10px; margin-bottom: 11px; }
.nb-thumb {
  width: var(--card-thumb); height: calc(var(--card-thumb) * 1.3); flex: none;
  border-radius: 7px 11px 11px 7px; position: relative;
  background: linear-gradient(150deg, var(--nb, var(--accent)), color-mix(in srgb, var(--nb, var(--accent)) 58%, #ffffff));
  display: grid; place-items: center;
  color: #fff; font-weight: 700; font-size: 15px;
  box-shadow: 0 3px 9px color-mix(in srgb, var(--nb, var(--accent)) 32%, transparent);
}
.nb-thumb::before {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 6px;
  border-radius: 7px 0 0 7px; background: rgba(0, 0, 0, .14);
}
.nb-card-meta { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.nb-card-cat { font-size: 12px; color: var(--text-faint); display: flex; align-items: center; gap: 5px; }
.nb-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--nb, var(--accent)); flex: none; }
.nb-card-date { font-size: 11.5px; color: var(--text-faint); font-variant-numeric: tabular-nums; }
.nb-card h3 {
  margin: 0 0 7px; font-size: 16px; line-height: 1.45; font-family: var(--heading-font);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.nb-card p {
  margin: 0 0 12px; font-size: 13px; color: var(--text-soft); line-height: 1.6;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.nb-card-foot { margin-top: auto; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.tag {
  font-size: 11px; color: var(--accent-text); background: var(--accent-soft);
  border-radius: 999px; padding: 2px 9px; white-space: nowrap;
}
.nb-badge { margin-left: auto; font-size: 11px; color: var(--text-faint); display: flex; align-items: center; gap: 4px; white-space: nowrap; }
.nb-star { position: absolute; right: 13px; top: 13px; font-size: 13px; }

/* ---------- 列表视图 ---------- */
:root[data-list="list"] .grid-notes { grid-template-columns: 1fr; gap: 8px; }
:root[data-list="list"] .nb-card { flex-direction: row; align-items: center; gap: 14px; padding: 10px 16px; border-radius: var(--radius-sm); }
:root[data-list="list"] .nb-card::before { inset: 0 auto 0 0; width: 4px; height: auto; }
:root[data-list="list"] .nb-card-top { margin: 0; flex: none; }
:root[data-list="list"] .nb-thumb { --card-thumb: 34px; }
:root[data-list="list"] .nb-card h3 { margin: 0; -webkit-line-clamp: 1; font-size: 15px; flex: 1; }
:root[data-list="list"] .nb-card p { display: none; }
:root[data-list="list"] .nb-card-foot { margin: 0; flex: none; }
:root[data-list="list"] .nb-card-cat { display: none; }
:root[data-list="list"] .nb-star { position: static; }

.strip-scroll .nb-card { width: 200px; flex: none; }

/* ---------- 分类书架 ---------- */
.cats { display: grid; grid-template-columns: repeat(auto-fill, minmax(152px, 1fr)); gap: 12px; }
.cat-card {
  position: relative; border: 1px solid var(--line); border-radius: var(--radius-sm);
  background: var(--paper); padding: 14px; color: inherit; overflow: hidden;
  box-shadow: var(--shadow-card); transition: transform .16s, box-shadow .16s;
  display: flex; flex-direction: column; gap: 4px;
}
.cat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); }
.cat-card .cat-strip { display: flex; gap: 3px; margin-bottom: 9px; }
.cat-card .cat-strip i { height: 26px; flex: 1; border-radius: 3px; opacity: .92; }
.cat-card b { font-size: 14px; }
.cat-card span { font-size: 11.5px; color: var(--text-faint); }

/* ---------- 空状态 ---------- */
.empty { text-align: center; padding: 64px 20px; color: var(--text-faint); }
.empty .big { font-size: 34px; margin-bottom: 10px; }
.empty code { font-family: var(--font-mono); font-size: .92em; }

/* ============================ 检索结果 ============================ */
.search-results { display: flex; flex-direction: column; gap: 10px; }
.result {
  display: block; padding: 14px 16px; background: var(--paper);
  border: 1px solid var(--line); border-radius: var(--radius-sm); color: inherit;
  box-shadow: var(--shadow-card); transition: transform .15s, box-shadow .15s, border-color .15s;
}
.result:hover { transform: translateX(2px); border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); box-shadow: var(--shadow-hover); }
.result-title { font-weight: 650; font-size: 14.5px; margin-bottom: 4px; display: flex; gap: 9px; align-items: baseline; }
.result-title .where { font-size: 11px; color: var(--text-faint); font-weight: 400; }
.result-snippet { font-size: 13px; color: var(--text-soft); line-height: 1.65; }
.result-snippet mark, .nb-card mark, .ql-body mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 2px; }

/* ============================ 笔记本（正文） ============================ */
.reader { display: grid; grid-template-columns: minmax(0, var(--content-max)) var(--toc-w); gap: 46px; justify-content: center; padding: 10px 26px 90px; }
.article { min-width: 0; background: var(--article-bg); padding: var(--article-pad); border-radius: var(--radius); }
:root[data-layout="magazine"] .article { box-shadow: var(--shadow-card); border: 1px solid var(--line); }

.article-head { margin: 14px 0 26px; padding-bottom: 20px; border-bottom: 1px solid var(--line); }

vedLinks":[]},{"slug":"markdown-syntax","title":"Markdown 语法速查","date":"2026-02-16","category":"写作规范","tags":["Markdown","排版","公式","代码"],"related":[],"links":["数模方法速查卡"],"pinned":false,"status":"","source":"01-markdown-语法速查.md","excerpt":"本站支持的全部写法：标题、列表、待办、表格、代码块、公式、引用提示框、双链、图片与附件。","html":"<h1 id=\"markdown-语法速查\">Markdown 语法速查<a class=\"md-anchor\" href=\"#markdown-语法速查\" aria-label=\"锚点\">#</a></h1>\n<p>写笔记时对照这一页，够用了。所有写法都已在本站实测通过。</p>\n<h2 id=\"标题与分级\">标题与分级<a class=\"md-anchor\" href=\"#标题与分级\" aria-label=\"锚点\">#</a></h2>\n<p><code class=\"md-inline-code\">#</code> 到 <code class=\"md-inline-code\">######</code> 六级标题。<strong>本页右侧目录只收录二到四级</strong>，所以正文里请用 <code class=\"md-inline-code\">##</code> 起头，<code class=\"md-inline-code\">#</code> 留给标题本身。</p>\n<h2 id=\"强调删除线与高亮\">强调、删除线与高亮<a class=\"md-anchor\" href=\"#强调删除线与高亮\" aria-label=\"锚点\">#</a></h2>\n<div class=\"md-table-wrap\"><table><thead><tr><th>写法</th><th>效果</th></tr></thead><tbody><tr><td><code class=\"md-inline-code\">**粗体**</code></td><td><strong>粗体</strong></td></tr><tr><td><code class=\"md-inline-code\">*斜体*</code></td><td><em>斜体</em></td></tr><tr><td><code class=\"md-inline-code\">~~删除线~~</code></td><td><del>删除线</del></td></tr><tr><td><code class=\"md-inline-code\">==高亮==</code></td><td><mark>高亮</mark></td></tr><tr><td><code class=\"md-inline-code\">`行内代码`</code></td><td><code class=\"md-inline-code\">行内代码</code></td></tr></tbody></table></div>\n<h2 id=\"列表与待办\">列表与待办<a class=\"md-anchor\" href=\"#列表与待办\" aria-label=\"锚点\">#</a></h2>\n<ul class=\"md-list\"><li>无序列表用 <code class=\"md-inline-code\">-</code></li><li>缩进两个空格可以嵌套</li><li>就像这样</li><li>数字列表用 <code class=\"md-inline-code\">1. 2. 3.</code></li></ul>\n<p>待办清单（方括号里打 x 表示完成）：</p>\n<ul class=\"md-list\"><li><span class=\"md-todo done\"></span>已经做完的事</li><li><span class=\"md-todo \"></span>还没做的事</li><li><span class=\"md-todo \"></span>记得给自己留 deadline</li></ul>\n<h2 id=\"表格\">表格<a class=\"md-anchor\" href=\"#表格\" aria-label=\"锚点\">#</a></h2>\n<div class=\"md-table-wrap\"><table><thead><tr><th>字段</th><th>类型</th><th style=\"text-align:center\">必填</th><th>说明</th></tr></thead><tbody><tr><td>title</td><td>文本</td><td style=\"text-align:center\">是</td><td>标题</td></tr><tr><td>category</td><td>文本</td><td style=\"text-align:center\">否</td><td>分类，默认取文件夹名</td></tr><tr><td>tags</td><td>列表</td><td style=\"text-align:center\">否</td><td>标签</td></tr><tr><td>date</td><td>日期</td><td style=\"text-align:center\">否</td><td>不写取文件修改时间</td></tr><tr><td>pinned</td><td>布尔</td><td style=\"text-align:center\">否</td><td><code class=\"md-inline-code\">true</code> 置顶首页</td></tr></tbody></table></div>\n<h2 id=\"代码块\">代码块<a class=\"md-anchor\" href=\"#代码块\" aria-label=\"锚点\">#</a></h2>\n<p><figure class=\"md-code\" data-lang=\"python\"><figcaption class=\"md-code-bar\"><span class=\"md-code-lang\">python</span><button class=\"md-code-copy\" type=\"button\" data-copy>复制</button></figcaption><pre><code class=\"language-python\">import numpy as np\n\ndef stationary_matrix(n=3, seed=42):\n    &quot;&quot;&quot;构造一个随机矩阵并求平稳分布&quot;&quot;&quot;\n    rng = np.random.default_rng(seed)\n    P = rng.random((n, n))\n    P = P / P.sum(axis=1, keepdims=True)      # 每行归一化\n    w, v = np.linalg.eig(P.T)\n    i = np.argmin(np.abs(w - 1.0))\n    pi = np.real(v[:, i])\n    return P, pi / pi.sum()\n\nP, pi = stationary_matrix()\nprint(&quot;平稳分布:&quot;, np.round(pi, 4))</code></pre></figure></p>\n<p><figure class=\"md-code\" data-lang=\"javascript\"><figcaption class=\"md-code-bar\"><span class=\"md-code-lang\">javascript</span><button class=\"md-code-copy\" type=\"button\" data-copy>复制</button></figcaption><pre><code class=\"language-javascript\">// 前端也一样能高亮\nconst notes = await fetch('data/index.json').then((r) =&gt; r.json());\nconsole.log(`共 ${notes.notes.length} 篇笔记`);</code></pre></figure></p>\n<h2 id=\"公式\">公式<a class=\"md-anchor\" href=\"#公式\" aria-label=\"锚点\">#</a></h2>\n<p>行内公式用单个美元符号：总体期望 <span class=\"md-math-inline\" data-tex=\"\\mathbb{E}[X]=\\sum_{i} x_i p_i\"></span> 可以直接嵌在句子里。</p>\n<p>块级公式用两个美元符号独占一段：</p>\n<p><div class=\"md-math-block\" data-tex=\"P(X_{n+1}=j \\mid X_n=i,\\; X_{n-1}=i_{n-1},\\dots) = P_{ij}\"></div></p>\n<p><div class=\"md-math-block\" data-tex=\"\\pi P = \\pi,\\qquad \\sum_{j=1}^{N}\\pi_j = 1\"></div></p>\n<div class=\"md-callout md-callout-info\"><p class=\"md-callout-title\">公式渲染原理</p>[object Object]</div>\n<h2 id=\"引用与提示框\">引用与提示框<a class=\"md-anchor\" href=\"#引用与提示框\" aria-label=\"锚点\">#</a></h2>\n<p>普通引用：</p>\n<blockquote>[object Object]</blockquote>\n<p>提示框（GitHub 风格，本站支持 6 种）：</p>\n<div class=\"md-callout md-callout-info\"><p class=\"md-callout-title\">信息</p>[object Object]</div>\n<h2 id=\"自动目录块\">自动目录块<a class=\"md-anchor\" href=\"#自动目录块\" aria-label=\"锚点\">#</a></h2>\n<p>在某处写一个二级标题叫「目录」，紧跟的列表会自动渲染成卡片式索引：</p>\n<ul class=\"md-index-list\"><li><span>情报检索三件套</span></li><li><span>数据清洗清单</span></li><li><span>模型选型决策点</span></li></ul>\n<h2 id=\"双链与反向链接\">双链与反向链接<a class=\"md-anchor\" href=\"#双链与反向链接\" aria-label=\"锚点\">#</a></h2>\n<p>写 <code class=\"md-inline-code\">[[数模方法速查卡]]</code> 会渲染成站内跳转链接：<a class=\"md-wikilink\" data-wikilink=\"数模方法速查卡\" href=\"#/note/%E6%95%B0%E6%A8%A1%E6%96%B9%E6%B3%95%E9%80%9F%E6%9F%A5%E5%8D%A1\">数模方法速查卡</a>。被引用的那篇笔记底部会自动出现「被这些笔记引用」。</p>\n<h2 id=\"图片与附件\">图片与附件<a class=\"md-anchor\" href=\"#图片与附件\" aria-label=\"锚点\">#</a></h2>\n<p><figure class=\"md-code\" data-lang=\"markdown\"><figcaption class=\"md-code-bar\"><span class=\"md-code-lang\">markdown</span><button class=\"md-code-copy\" type=\"button\" data-copy>复制</button></figcaption><pre><code class=\"language-markdown\">![图片说明](assets/图片文件名.png)\n[论文附件](assets/paper.pdf)</code></pre></figure></p>\n<p>图片在正文里点一下会放大；PDF 附件点击后由浏览器直接打开。</p>\n<div class=\"md-callout md-callout-tip\"><p class=\"md-callout-title\">图片文字检索</p>[object Object]</div>\n<h2 id=\"分隔线\">分隔线<a class=\"md-anchor\" href=\"#分隔线\" aria-label=\"锚点\">#</a></h2>\n<p>三个短横线：</p>\n<hr>\n<p>以上就是全部写法。够用、不啰嗦。</p>","headings":[{"level":1,"text":"Markdown 语法速查","id":"markdown-语法速查"},{"level":2,"text":"标题与分级","id":"标题与分级"},{"level":2,"text":"强调、删除线与高亮","id":"强调删除线与高亮"},{"level":2,"text":"列表与待办","id":"列表与待办"},{"level":2,"text":"表格","id":"表格"},{"level":2,"text":"代码块","id":"代码块"},{"level":2,"text":"公式","id":"公式"},{"level":2,"text":"引用与提示框","id":"引用与提示框"},{"level":2,"text":"自动目录块","id":"自动目录块"},{"level":2,"text":"双链与反向链接","id":"双链与反向链接"},{"level":2,"text":"图片与附件","id":"图片与附件"},{"level":2,"text":"分隔线","id":"分隔线"}],"search":"Markdown 语法速查 \u0001 Markdown 语法速查 # 写笔记时对照这一页，够用了。所有写法都已在本站实测通过。 标题与分级 # # 到 ###### 六级标题。 本页右侧目录只收录二到四级 ，所以正文里请用 ## 起头， # 留给标题本身。 强调、删除线与高亮 # 写法 效果 **粗体** 粗体 *斜体* 斜体 ~~删除线~~ 删除线 ==高亮== 高亮 `行内代码` 行内代码 列表与待办 # 无序列表用 - 缩进两个空格可以嵌套 就像这样 数字列表用 1. 2. 3. 待办清单（方括号里打 x 表示完成）： 已经做完的事 还没做的事 记得给自己留 deadline 表格 # 字段 类型 必填 说明 title 文本 是 标题 category 文本 否 分类，默认取文件夹名 tags 列表 否 标签 date 日期 否 不写取文件修改时间 pinned 布尔 否 true 置顶首页 代码块 # 公式 # 行内公式用单个美元符号：总体期望 可以直接嵌在句子里。 块级公式用两个美元符号独占一段： 公式渲染原理 [object Object] 引用与提示框 # 普通引用： [object Object] 提示框（GitHub 风格，本站支持 6 种）： 信息 [object Object] 自动目录块 # 在某处写一个二级标题叫「目录」，紧跟的列表会自动渲染成卡片式索引： 情报检索三件套 数据清洗清单 模型选型决策点 双链与反向链接 # 写 [[数模方法速查卡]] 会渲染成站内跳转链接： 数模方法速查卡 。被引用的那篇笔记底部会自动出现「被这些笔记引用」。 图片与附件 # 图片在正文里点一下会放大；PDF 附件点击后由浏览器直接打开。 图片文字检索 [object Object] 分隔线 # 三个短横线： 以上就是全部写法。够用、不啰嗦。 import numpy as np def stationary_matrix(n=3, seed=42): \"\"\"构造一个随机矩阵并求平稳分布\"\"\" rng = np.random.default_rng(seed) P = rng.random((n, n)) P = P / P.sum(axis=1, keepdims=True) # 每行归一化 w, v = np.linalg.eig(P.T) i = np.argmin(np.abs(w - 1.0)) pi = np.real(v[:, i]) return P, pi / pi.sum() P, pi = stationary_matrix() print(\"平稳分布:\", np.round(pi, 4)) // 前端也一样能高亮 const notes = await fetch('data/index.json').then((r) => r.json()); console.log(`共 ${notes.notes.length} 篇笔记`); ![图片说明](assets/图片文件名.png) [论文附件](assets/paper.pdf) \u0001 Markdown 排版 公式 代码 \u0001 写作规范 \u0001 ","attachments":[],"cover":{"ink":"#E0913A","soft":"#FBF0E0","glyph":"MA"},"backlinks":[],"missingLinks":[],"resolvedLinks":["mm-methods"]},{"slug":"markov-chain","title":"随机过程 · 马尔可夫链建模笔记","date":"2026-02-14","category":"数学建模","tags":["随机过程","马尔可夫链","数值计算","图表"],"related":["数模方法速查卡"],"links":["数模方法速查卡"],"pinned":false,"status":"","source":"02-随机过程-马尔可夫链建模.md","excerpt":"从状态划分到平稳分布求解再到结论表达，一条链走完马尔可夫链类赛题；含代码与收敛图。","html":"<h1 id=\"随机过程-马尔可夫链建模笔记\">随机过程 · 马尔可夫链建模笔记<a class=\"md-anchor\" href=\"#随机过程-马尔可夫链建模笔记\" aria-label=\"锚点\">#</a></h1>\n<p>这类题的共同骨架是：<strong>把连续的现实切成有限个状态 → 估计一步转移概率 → 求长期分布 → 用长期分布回答决策问题</strong>。下面按这四步记录。</p>\n<h2 id=\"第一步状态划分\">第一步：状态划分<a class=\"md-anchor\" href=\"#第一步状态划分\" aria-label=\"锚点\">#</a></h2>\n<p>状态必须是「互斥且完备」的。划分太粗，转移概率失去意义；划分太细，样本量撑不起参数估计。</p>\n<div class=\"md-callout md-callout-important\"><p class=\"md-callout-title\">状态数经验值</p>[object Object]</div>\n<h2 id=\"第二步估计转移矩阵\">第二步：估计转移矩阵<a class=\"md-anchor\" href=\"#第二步估计转移矩阵\" aria-label=\"锚点\">#</a></h2>\n<p>设样本中从状态 <span class=\"md-math-inline\" data-tex=\"i\"></span> 转移到状态 <span class=\"md-math-inline\" data-tex=\"j\"></span> 的频数为 <span class=\"md-math-inline\" data-tex=\"n_{ij}\"></span>，则</p>\n<p><div class=\"md-math-block\" data-tex=\"\\hat{P}_{ij}=\\frac{n_{ij}}{\\sum_{j=1}^{k} n_{ij}},\\qquad i,j=1,\\dots,k\"></div></p>\n<p>若某些 <span class=\"md-math-inline\" data-tex=\"n_{ij}=0\"></span> 会造成零概率陷阱，用拉普拉斯平滑（加一平滑）：</p>\n<p><div class=\"md-math-block\" data-tex=\"\\hat{P}_{ij}=\\frac{n_{ij}+\\alpha}{n_i + k\\alpha},\\qquad \\alpha \\in [0.1,\\,1]\"></div></p>\n<p><figure class=\"md-code\" data-lang=\"python\"><figcaption class=\"md-code-bar\"><span class=\"md-code-lang\">python</span><button class=\"md-code-copy\" type=\"button\" data-copy>复制</button></figcaption><pre><code class=\"language-python\">import numpy as np\n\ndef estimate_transition(seq, k, alpha=1.0):\n    &quot;&quot;&quot;seq: 状态序列（0..k-1）；返回加一平滑后的转移矩阵&quot;&quot;&quot;\n    counts = np.zeros((k, k))\n    for a, b in zip(seq[:-1], seq[1:]):\n        counts[a, b] += 1\n    return (counts + alpha) / (counts.sum(axis=1, keepdims=True) + k * alpha)\n\ndef stationary(P):\n    &quot;&quot;&quot;求平稳分布：解 pi P = pi, sum(pi)=1&quot;&quot;&quot;\n    k = P.shape[0]\n    A = np.vstack([P.T - np.eye(k), np.ones(k)])\n    b = np.append(np.zeros(k), 1.0)\n    pi, *_ = np.linalg.lstsq(A, b, rcond=None)   # 最小二乘更稳\n    return pi / pi.sum()\n\nrng = np.random.default_rng(42)\nP = estimate_transition(rng.integers(0, 3, size=2000), k=3)\nprint(&quot;平稳分布 π =&quot;, np.round(stationary(P), 4))</code></pre></figure></p>\n<h2 id=\"第三步长期行为\">第三步：长期行为<a class=\"md-anchor\" href=\"#第三步长期行为\" aria-label=\"锚点\">#</a></h2>\n<p>若链不可约且非周期，则 <span class=\"md-math-inline\" data-tex=\"\\pi = \\lim_{n\\to\\infty} \\pi^{(n)}\"></span>，与初始分布无关。验证收敛可以画幂次迭代曲线：</p>\n<p><div class=\"md-math-block\" data-tex=\"\\pi^{(n+1)} = \\pi^{(n)} P\"></div></p>\n<p><figure class=\"md-figure\"><img src=\"assets/demo-convergence.png\" alt=\"模型收敛示意图（演示图片文字检索）\" loading=\"lazy\" decoding=\"async\" data-zoom-src=\"assets/demo-convergence.png\"><figcaption>模型收敛示意图（演示图片文字检索）</figcaption></figure></p>\n<div class=\"md-callout md-callout-warn\"><p class=\"md-callout-title\">常见失分点</p>[object Object]</div>\n<h2 id=\"第四步结论表达\">第四步：结论表达<a class=\"md-anchor\" href=\"#第四步结论表达\" aria-label=\"锚点\">#</a></h2>\n<p>答题句式和数字要给全，避免「大约会趋于稳定」这类空话：</p>\n<div class=\"md-table-wrap\"><table><thead><tr><th>初始状态</th><th>5 步后处于状态 A 的概率</th><th>长期概率 π(A)</th><th>收敛所需步数</th></tr></thead><tbody><tr><td>状态 0</td><td>0.4521</td><td>0.3846</td><td>11</td></tr><tr><td>状态 1</td><td>0.3987</td><td>0.3846</td><td>8</td></tr><tr><td>状态 2</td><td>0.3312</td><td>0.3846</td><td>9</td></tr></tbody></table></div>\n<p>结论写法：<em>\"在给定转移矩阵下，系统长期处于状态 A 的概率为 0.3846；从任一初始状态出发，约 8～11 步后进入稳态，误差小于 <span class=\"md-math-inline\" data-tex=\"10^{-3}\"></span>。\"</em></p>\n<h2 id=\"灵敏度转移概率估错会怎样\">灵敏度：转移概率估错会怎样<a class=\"md-anchor\" href=\"#灵敏度转移概率估错会怎样\" aria-label=\"锚点\">#</a></h2>\n<p>把转移矩阵每一行扰动 <span class=\"md-math-inline\" data-tex=\"\\pm 5\\%\"></span>（重新归一化），观察 <span class=\"md-math-inline\" data-tex=\"\\pi\"></span> 的变化幅度：</p>\n<p><figure class=\"md-code\" data-lang=\"python\"><figcaption class=\"md-code-bar\"><span class=\"md-code-lang\">python</span><button class=\"md-code-copy\" type=\"button\" data-copy>复制</button></figcaption><pre><code class=\"language-python\">def perturb(P, eps=0.05, n=300, seed=7):\n    rng = np.random.default_rng(seed)\n    res = []\n    for _ in range(n):\n        Q = P * (1 + rng.uniform(-eps, eps, P.shape))\n        Q = Q / Q.sum(axis=1, keepdims=True)\n        res.append(stationary(Q))\n    res = np.array(res)\n    return res.mean(axis=0), res.std(axis=0)\n\nmean_pi, sd_pi = perturb(P)\nprint(&quot;π 均值:&quot;, np.round(mean_pi, 4))\nprint(&quot;π 标准差:&quot;, np.round(sd_pi, 4))</code></pre></figure></p>\n<p>若标准差相对均值超过 10%，说明数据量不足或状态划分过细，需要在论文里明确写为局限。</p>\n<h2 id=\"一句话总结\">一句话总结<a class=\"md-anchor\" href=\"#一句话总结\" aria-label=\"锚点\">#</a></h2>\n<p>马尔可夫链类赛题拿分的不是「会不会求平稳分布」，而是<strong>状态怎么划、参数怎么估、结论怎么写数字</strong>。</p>\n<p>相关：<a class=\"md-wikilink\" data-wikilink=\"数模方法速查卡\" href=\"#/note/%E6%95%B0%E6%A8%A1%E6%96%B9%E6%B3%95%E9%80%9F%E6%9F%A5%E5%8D%A1\">数模方法速查卡</a></p>\n<section class=\"md-attach-text\" data-file=\"demo-convergence.png\"><h4>附件文字 · demo-convergence.png</h4><pre>模型收敛示意图（演示图片文字检索）。标题：MARKOV CHAIN CONVERGENCE。纵轴 P（概率）0.0 到 1.0，横轴 STEPS 0-40。三条曲线分别为 PI(A) = 0.3846、PI(B) = 0.5521、PI(C) = 0.0633，其中 PI(A) 从 0.05 出发，约 8 到 11 步后收敛到平稳值 0.3846，误差小于 1e-3。图中水平虚线表示平稳分布，可见曲线单调逼近该值。关键词：马尔可夫链 平稳分布 收敛曲线 转移矩阵 灵敏度分析 演示图 图表识别。</pre></section>","headings":[{"level":1,"text":"随机过程 · 马尔可夫链建模笔记","id":"随机过程-马尔可夫链建模笔记"},{"level":2,"text":"第一步：状态划分","id":"第一步状态划分"},{"level":2,"text":"第二步：估计转移矩阵","id":"第二步估计转移矩阵"},{"level":2,"text":"第三步：长期行为","id":"第三步长期行为"},{"level":2,"text":"第四步：结论表达","id":"第四步结论表达"},{"level":2,"text":"灵敏度：转移概率估错会怎样","id":"灵敏度转移概率估错会怎样"},{"level":2,"text":"一句话总结","id":"一句话总结"}],"search":"随机过程 · 马尔可夫链建模笔记 \u0001 随机过程 · 马尔可夫链建模笔记 # 这类题的共同骨架是： 把连续的现实切成有限个状态 → 估计一步转移概率 → 求长期分布 → 用长期分布回答决策问题 。下面按这四步记录。 第一步：状态划分 # 状态必须是「互斥且完备」的。划分太粗，转移概率失去意义；划分太细，样本量撑不起参数估计。 状态数经验值 [object Object] 第二步：估计转移矩阵 # 设样本中从状态 转移到状态 的频数为 ，则 若某些 会造成零概率陷阱，用拉普拉斯平滑（加一平滑）： 第三步：长期行为 # 若链不可约且非周期，则 ，与初始分布无关。验证收敛可以画幂次迭代曲线： 模型收敛示意图（演示图片文字检索） 常见失分点 [object Object] 第四步：结论表达 # 答题句式和数字要给全，避免「大约会趋于稳定」这类空话： 初始状态 5 步后处于状态 A 的概率 长期概率 π(A) 收敛所需步数 状态 0 0.4521 0.3846 11 状态 1 0.3987 0.3846 8 状态 2 0.3312 0.3846 9 结论写法： \"在给定转移矩阵下，系统长期处于状态 A 的概率为 0.3846；从任一初始状态出发，约 8～11 步后进入稳态，误差小于 。\" 灵敏度：转移概率估错会怎样 # 把转移矩阵每一行扰动 （重新归一化），观察 的变化幅度： 若标准差相对均值超过 10%，说明数据量不足或状态划分过细，需要在论文里明确写为局限。 一句话总结 # 马尔可夫链类赛题拿分的不是「会不会求平稳分布」，而是 状态怎么划、参数怎么估、结论怎么写数字 。 相关： 数模方法速查卡 import numpy as np def estimate_transition(seq, k, alpha=1.0): \"\"\"seq: 状态序列（0..k-1）；返回加一平滑后的转移矩阵\"\"\" counts = np.zeros((k, k)) for a, b in zip(seq[:-1], seq[1:]): counts[a, b] += 1 return (counts + alpha) / (counts.sum(axis=1, keepdims=True) + k * alpha) def stationary(P): \"\"\"求平稳分布：解 pi P = pi, sum(pi)=1\"\"\" k = P.shape[0] A = np.vstack([P.T - np.eye(k), np.ones(k)]) b = np.append(np.zeros(k), 1.0) pi, *_ = np.linalg.lstsq(A, b, rcond=None) # 最小二乘更稳 return pi / pi.sum() rng = np.random.default_rng(42) P = estimate_transition(rng.integers(0, 3, size=2000), k=3) print(\"平稳分布 π =\", np.round(stationary(P), 4)) def perturb(P, eps=0.05, n=300, seed=7): rng = np.random.default_rng(seed) res = [] for _ in range(n): Q = P * (1 + rng.uniform(-eps, eps, P.shape)) Q = Q / Q.sum(axis=1, keepdims=True) res.append(stationary(Q)) res = np.array(res) return res.mean(axis=0), res.std(axis=0) mean_pi, sd_pi = perturb(P) print(\"π 均值:\", np.round(mean_pi, 4)) print(\"π 标准差:\", np.round(sd_pi, 4)) \u0001 随机过程 马尔可夫链 数值计算 图表 \u0001 数学建模 \u0001 模型收敛示意图（演示图片文字检索）。标题：MARKOV CHAIN CONVERGENCE。纵轴 P（概率）0.0 到 1.0，横轴 STEPS 0-40。三条曲线分别为 PI(A) = 0.3846、PI(B) = 0.5521、PI(C) = 0.0633，其中 PI(A) 从 0.05 出发，约 8 到 11 步后收敛到平稳值 0.3846，误差小于 1e-3。图中水平虚线表示平稳分布，可见曲线单调逼近该值。关键词：马尔可夫链 平稳分布 收敛曲线 转移矩阵 灵敏度分析 演示图 图表识别。","attachments":["demo-convergence.png"],"cover":{"ink":"#EA5A47","soft":"#FDEBE7","glyph":"随"},"backlinks":["mm-methods"],"missingLinks":[],"resolvedLinks":["mm-methods"]},{"slug":"mm-methods","title":"数模方法速查卡","date":"2026-02-12","category":"数学建模","tags":["方法选型","优化","预测","评价","决策树"],"related":["markov-chain"],"links":["随机过程 · 马尔可夫链建模笔记"],"pinned":false,"status":"","source":"03-数模方法速查卡.md","excerpt":"按赛题类型直接定位方法：优化、预测、评价、机理、统计，一张决策表 + 每类首选两三个模型。","html":"<h1 id=\"数模方法速查卡\">数模方法速查卡<a class=\"md-anchor\" href=\"#数模方法速查卡\" aria-label=\"锚点\">#</a></h1>\n<p>拿到题先判类型，再选方法。<strong>选错类型比选错模型致命得多。</strong></p>\n<h2 id=\"一眼定类型\">一眼定类型<a class=\"md-anchor\" href=\"#一眼定类型\" aria-label=\"锚点\">#</a></h2>\n<div class=\"md-table-wrap\"><table><thead><tr><th>题目关键词</th><th>类型</th><th>首选方法</th><th>备选</th></tr></thead><tbody><tr><td>最小成本、最大化收益、排班、路径</td><td>优化</td><td>整数规划（MILP）</td><td>遗传/模拟退火、贪心+局部搜索</td></tr><tr><td>预测未来、趋势、走势</td><td>预测</td><td>ARIMA / 指数平滑</td><td>LSTM、灰色 GM(1,1)、随机森林</td></tr><tr><td>排名、打分、优劣、综合</td><td>评价</td><td>熵权法 + TOPSIS</td><td>AHP、主成分分析、DEA</td></tr><tr><td>机理、物理过程、传染、扩散</td><td>机理</td><td>微分方程组</td><td>元胞自动机、蒙特卡洛</td></tr><tr><td>关系、影响因素、相关性</td><td>统计</td><td>多元回归</td><td>岭回归/Lasso、结构方程</td></tr><tr><td>策略、博弈、多主体</td><td>决策</td><td>博弈论 / 多目标优化</td><td>强化学习、仿真</td></tr></tbody></table></div>\n<h2 id=\"优化类建模顺序\">优化类：建模顺序<a class=\"md-anchor\" href=\"#优化类建模顺序\" aria-label=\"锚点\">#</a></h2>\n<ol class=\"md-list\"><li><strong>决策变量</strong>是什么（连续/整数/0-1）</li><li><strong>目标函数</strong>（单目标先写清，多目标再加权或 ε-约束）</li><li><strong>约束</strong>逐个列（容量、平衡、逻辑、非负）</li><li>检查<strong>规模</strong>：变量数 > 10⁴ 就上启发式，否则精确解</li></ol>\n<p><figure class=\"md-code\" data-lang=\"python\"><figcaption class=\"md-code-bar\"><span class=\"md-code-lang\">python</span><button class=\"md-code-copy\" type=\"button\" data-copy>复制</button></figcaption><pre><code class=\"language-python\"># 线性规划模板（scipy）\nfrom scipy.optimize import linprog\nc = [-3, -5]                      # 最大化 3x+5y → 取负\nA = [[1, 0], [0, 2], [3, 2]]\nb = [4, 12, 18]\nres = linprog(c, A_ub=A, b_ub=b, bounds=[(0, None), (0, None)], method='highs')\nprint(res.fun * -1, res.x)</code></pre></figure></p>\n<p>多目标别直接拍权重：先求 Pareto 前沿（ε-约束法），再说明折中依据。</p>\n<h2 id=\"预测类数据先说话\">预测类：数据先说话<a class=\"md-anchor\" href=\"#预测类数据先说话\" aria-label=\"锚点\">#</a></h2>\n<div class=\"md-callout md-callout-important\"><p class=\"md-callout-title\">先看数据，再选模型</p>[object Object]</div>\n<p>评价指标统一用 <strong>MAPE</strong> 或 <strong>RMSE</strong>，并与「朴素法（上一期值）」对比——打不过朴素法就没必要上复杂模型。</p>\n<h2 id=\"评价类三件套\">评价类：三件套<a class=\"md-anchor\" href=\"#评价类三件套\" aria-label=\"锚点\">#</a></h2>\n<ol class=\"md-list\"><li>指标标准化（正向/负向/区间型处理）</li><li>权重确定（熵权法客观 / AHP 主观，常用组合赋权）</li><li>排序（TOPSIS 贴近度，或灰色关联度）</li></ol>\n<p><figure class=\"md-code\" data-lang=\"python\"><figcaption class=\"md-code-bar\"><span class=\"md-code-lang\">python</span><button class=\"md-code-copy\" type=\"button\" data-copy>复制</button></figcaption><pre><code class=\"language-python\">import numpy as np\ndef entropy_weight(X):\n    &quot;&quot;&quot;X: n×m 正向化后的矩阵 → 客观权重&quot;&quot;&quot;\n    P = X / X.sum(axis=0, keepdims=True)\n    P = np.clip(P, 1e-12, None)\n    e = -(P * np.log(P)).sum(axis=0) / np.log(len(X))\n    g = 1 - e\n    return g / g.sum()</code></pre></figure></p>\n<h2 id=\"检验与灵敏度评委最爱看\">检验与灵敏度（评委最爱看）<a class=\"md-anchor\" href=\"#检验与灵敏度评委最爱看\" aria-label=\"锚点\">#</a></h2>\n<ul class=\"md-list\"><li>拟合优度 <span class=\"md-math-inline\" data-tex=\"R^2\"></span>、残差正态性、多重共线性（VIF）</li><li><strong>灵敏度分析</strong>：关键参数 ±10% 扫描，看结论是否翻转</li><li><strong>稳健性</strong>：换一组随机种子/换一种距离度量，排名是否一致</li></ul>\n<h2 id=\"论文里必须出现的四句话\">论文里必须出现的四句话<a class=\"md-anchor\" href=\"#论文里必须出现的四句话\" aria-label=\"锚点\">#</a></h2>\n<ol class=\"md-list\"><li>为什么选这个模型（而不是隔壁那个）</li><li>模型假设是什么（每条标注强弱）</li><li>结果的具体数字（不是「显著提高」）</li><li>结果的不确定性（区间、误差、灵敏度）</li></ol>\n<p>相关：<a class=\"md-wikilink\" data-wikilink=\"随机过程 · 马尔可夫链建模笔记\" href=\"#/note/%E9%9A%8F%E6%9C%BA%E8%BF%87%E7%A8%8B%20%C2%B7%20%E9%A9%AC%E5%B0%94%E5%8F%AF%E5%A4%AB%E9%93%BE%E5%BB%BA%E6%A8%A1%E7%AC%94%E8%AE%B0\">随机过程 · 马尔可夫链建模笔记</a></p>","headings":[{"level":1,"text":"数模方法速查卡","id":"数模方法速查卡"},{"level":2,"text":"一眼定类型","id":"一眼定类型"},{"level":2,"text":"优化类：建模顺序","id":"优化类建模顺序"},{"level":2,"text":"预测类：数据先说话","id":"预测类数据先说话"},{"level":2,"text":"评价类：三件套","id":"评价类三件套"},{"level":2,"text":"检验与灵敏度（评委最爱看）","id":"检验与灵敏度评委最爱看"},{"level":2,"text":"论文里必须出现的四句话","id":"论文里必须出现的四句话"}],"search":"数模方法速查卡 \u0001 数模方法速查卡 # 拿到题先判类型，再选方法。 选错类型比选错模型致命得多。 一眼定类型 # 题目关键词 类型 首选方法 备选 最小成本、最大化收益、排班、路径 优化 整数规划（MILP） 遗传/模拟退火、贪心+局部搜索 预测未来、趋势、走势 预测 ARIMA / 指数平滑 LSTM、灰色 GM(1,1)、随机森林 排名、打分、优劣、综合 评价 熵权法 + TOPSIS AHP、主成分分析、DEA 机理、物理过程、传染、扩散 机理 微分方程组 元胞自动机、蒙特卡洛 关系、影响因素、相关性 统计 多元回归 岭回归/Lasso、结构方程 策略、博弈、多主体 决策 博弈论 / 多目标优化 强化学习、仿真 优化类：建模顺序 # 决策变量 是什么（连续/整数/0-1） 目标函数 （单目标先写清，多目标再加权或 ε-约束） 约束 逐个列（容量、平衡、逻辑、非负） 检查 规模 ：变量数 > 10⁴ 就上启发式，否则精确解 多目标别直接拍权重：先求 Pareto 前沿（ε-约束法），再说明折中依据。 预测类：数据先说话 # 先看数据，再选模型 [object Object] 评价指标统一用 MAPE 或 RMSE ，并与「朴素法（上一期值）」对比——打不过朴素法就没必要上复杂模型。 评价类：三件套 # 指标标准化（正向/负向/区间型处理） 权重确定（熵权法客观 / AHP 主观，常用组合赋权） 排序（TOPSIS 贴近度，或灰色关联度） 检验与灵敏度（评委最爱看） # 拟合优度 、残差正态性、多重共线性（VIF） 灵敏度分析 ：关键参数 ±10% 扫描，看结论是否翻转 稳健性 ：换一组随机种子/换一种距离度量，排名是否一致 论文里必须出现的四句话 # 为什么选这个模型（而不是隔壁那个） 模型假设是什么（每条标注强弱） 结果的具体数字（不是「显著提高」） 结果的不确定性（区间、误差、灵敏度） 相关： 随机过程 · 马尔可夫链建模笔记 # 线性规划模板（scipy） from scipy.optimize import linprog c = [-3, -5] # 最大化 3x+5y → 取负 A = [[1, 0], [0, 2], [3, 2]] b = [4, 12, 18] res = linprog(c, A_ub=A, b_ub=b, bounds=[(0, None), (0, None)], method='highs') print(res.fun * -1, res.x) import numpy as np def entropy_weight(X): \"\"\"X: n×m 正向化后的矩阵 → 客观权重\"\"\" P = X / X.sum(axis=0, keepdims=True) P = np.clip(P, 1e-12, None) e = -(P * np.log(P)).sum(axis=0) / np.log(len(X)) g = 1 - e return g / g.sum() \u0001 方法选型 优化 预测 评价 决策树 \u0001 数学建模 \u0001 ","attachments":[],"cover":{"ink":"#EA5A47","soft":"#FDEBE7","glyph":"数"},"backlinks":["markdown-syntax","markov-chain"],"missingLinks":[],"resolvedLinks":["markov-chain"]},{"slug":"deploy","title":"GitHub Pages 部署与更新笔记","date":"2026-02-10","category":"工具链","tags":["GitHub","部署","命令","踩坑"],"related":[],"links":[],"pinned":false,"status":"","source":"04-GitHub-Pages部署与更新.md","excerpt":"从零把站点推上 GitHub Pages，以及每次更新笔记要做的三条命令和常见坑。","html":"<h1 id=\"github-pages-部署与更新笔记\">GitHub Pages 部署与更新笔记<a class=\"md-anchor\" href=\"#github-pages-部署与更新笔记\" aria-label=\"锚点\">#</a></h1>\n<h2 id=\"一次性配置只做一次\">一次性配置（只做一次）<a class=\"md-anchor\" href=\"#一次性配置只做一次\" aria-label=\"锚点\">#</a></h2>\n<p><figure class=\"md-code\" data-lang=\"bash\"><figcaption class=\"md-code-bar\"><span class=\"md-code-lang\">bash</span><button class=\"md-code-copy\" type=\"button\" data-copy>复制</button></figcaption><pre><code class=\"language-bash\">git init\ngit add -A\ngit commit -m &quot;init: 个人笔记站&quot;\ngit branch -M main\ngit remote add origin https://github.com/&lt;你的用户名&gt;/&lt;仓库名&gt;.git\ngit push -u origin main</code></pre></figure></p>\n<p>然后在 GitHub 网页端：<strong>Settings → Pages → Source 选 <code class=\"md-inline-code\">Deploy from a branch</code> → 分支 <code class=\"md-inline-code\">main</code>、目录 <code class=\"md-inline-code\">/site</code></strong> → Save。</p>\n<p>一分钟左右，访问：</p>\n<p><figure class=\"md-code\" data-lang=\"text\"><figcaption class=\"md-code-bar\"><span class=\"md-code-lang\">text</span><button class=\"md-code-copy\" type=\"button\" data-copy>复制</button></figcaption><pre><code class=\"language-text\">https://&lt;你的用户名&gt;.github.io/&lt;仓库名&gt;/</code></pre></figure></p>\n<div class=\"md-callout md-callout-warn\"><p class=\"md-callout-title\">目录必须选 /site</p>[object Object]</div>\n<h2 id=\"每次更新笔记三条命令\">每次更新笔记（三条命令）<a class=\"md-anchor\" href=\"#每次更新笔记三条命令\" aria-label=\"锚点\">#</a></h2>\n<p><figure class=\"md-code\" data-lang=\"bash\"><figcaption class=\"md-code-bar\"><span class=\"md-code-lang\">bash</span><button class=\"md-code-copy\" type=\"button\" data-copy>复制</button></figcaption><pre><code class=\"language-bash\">node tools/build.mjs\ngit add -A &amp;&amp; git commit -m &quot;notes: 新增 xxx&quot;\ngit push</code></pre></figure></p>\n<p><code class=\"md-inline-code\">build.mjs</code> 会把 <code class=\"md-inline-code\">content/*.md</code> 重新生成到 <code class=\"md-inline-code\">docs/data/index.json</code>，Pages 收到推送后自动重新发布。</p>\n<div class=\"md-callout md-callout-tip\"><p class=\"md-callout-title\">只改文字不用重新构建？</p>[object Object]</div>\n<h2 id=\"本地预览改样式时必用\">本地预览（改样式时必用）<a class=\"md-anchor\" href=\"#本地预览改样式时必用\" aria-label=\"锚点\">#</a></h2>\n<p><figure class=\"md-code\" data-lang=\"bash\"><figcaption class=\"md-code-bar\"><span class=\"md-code-lang\">bash</span><button class=\"md-code-copy\" type=\"button\" data-copy>复制</button></figcaption><pre><code class=\"language-bash\">cd site\npython -m http.server 8080\n# 打开 http://127.0.0.1:8080</code></pre></figure></p>\n<p>或者：</p>\n<p><figure class=\"md-code\" data-lang=\"bash\"><figcaption class=\"md-code-bar\"><span class=\"md-code-lang\">bash</span><button class=\"md-code-copy\" type=\"button\" data-copy>复制</button></figcaption><pre><code class=\"language-bash\">npx serve site</code></pre></figure></p>\n<div class=\"md-callout md-callout-danger\"><p class=\"md-callout-title\">不要直接双击 index.html</p>[object Object]</div>\n<h2 id=\"常见坑速查\">常见坑速查<a class=\"md-anchor\" href=\"#常见坑速查\" aria-label=\"锚点\">#</a></h2>\n<div class=\"md-table-wrap\"><table><thead><tr><th>现象</th><th>原因</th><th>解决</th></tr></thead><tbody><tr><td>打开是 404</td><td>Pages 目录选了 <code class=\"md-inline-code\">/root</code></td><td>改成 <code class=\"md-inline-code\">/site</code></td></tr><tr><td>页面样式全丢</td><td>仓库名与路径层级不符</td><td>本站全部用相对路径，正常不会有；若自行加了绝对路径 <code class=\"md-inline-code\">/css/...</code> 必须去掉前导斜杠</td></tr><tr><td>数据不更新</td><td>忘了跑构建</td><td><code class=\"md-inline-code\">node tools/build.mjs</code> 后重新推送</td></tr><tr><td>中文文件名乱码</td><td>系统编码</td><td>文件名尽量用英文或加 <code class=\"md-inline-code\">slug</code> 字段</td></tr><tr><td>图片 404</td><td>图片没放 <code class=\"md-inline-code\">content/assets/</code></td><td>图片统一放该目录，正文写 <code class=\"md-inline-code\">assets/xxx.png</code></td></tr><tr><td>推送要密码</td><td>GitHub 已停用密码认证</td><td>用 Personal Access Token 或 <code class=\"md-inline-code\">gh auth login</code></td></tr></tbody></table></div>\n<h2 id=\"想用自定义域名\">想用自定义域名<a class=\"md-anchor\" href=\"#想用自定义域名\" aria-label=\"锚点\">#</a></h2>\n<ol class=\"md-list\"><li>域名 DNS 加一条 CNAME 指向 <code class=\"md-inline-code\">&lt;用户名&gt;.github.io</code></li><li>仓库 Settings → Pages → Custom domain 填入域名</li><li>勾选 Enforce HTTPS</li></ol>\n<div class=\"md-callout md-callout-info\"><p class=\"md-callout-title\">免费额度的边界</p>[object Object]</div>","headings":[{"level":1,"text":"GitHub Pages 部署与更新笔记","id":"github-pages-部署与更新笔记"},{"level":2,"text":"一次性配置（只做一次）","id":"一次性配置只做一次"},{"level":2,"text":"每次更新笔记（三条命令）","id":"每次更新笔记三条命令"},{"level":2,"text":"本地预览（改样式时必用）","id":"本地预览改样式时必用"},{"level":2,"text":"常见坑速查","id":"常见坑速查"},{"level":2,"text":"想用自定义域名","id":"想用自定义域名"}],"search":"GitHub Pages 部署与更新笔记 \u0001 GitHub Pages 部署与更新笔记 # 一次性配置（只做一次） # 然后在 GitHub 网页端： Settings → Pages → Source 选 Deploy from a branch → 分支 main 、目录 /site → Save。 一分钟左右，访问： 目录必须选 /site [object Object] 每次更新笔记（三条命令） # build.mjs 会把 content/*.md 重新生成到 docs/data/index.json ，Pages 收到推送后自动重新发布。 只改文字不用重新构建？ [object Object] 本地预览（改样式时必用） # 或者： 不要直接双击 index.html [object Object] 常见坑速查 # 现象 原因 解决 打开是 404 Pages 目录选了 /root 改成 /site 页面样式全丢 仓库名与路径层级不符 本站全部用相对路径，正常不会有；若自行加了绝对路径 /css/... 必须去掉前导斜杠 数据不更新 忘了跑构建 node tools/build.mjs 后重新推送 中文文件名乱码 系统编码 文件名尽量用英文或加 slug 字段 图片 404 图片没放 content/assets/ 图片统一放该目录，正文写 assets/xxx.png 推送要密码 GitHub 已停用密码认证 用 Personal Access Token 或 gh auth login 想用自定义域名 # 域名 DNS 加一条 CNAME 指向 &lt;用户名&gt;.github.io 仓库 Settings → Pages → Custom domain 填入域名 勾选 Enforce HTTPS 免费额度的边界 [object Object] git init git add -A git commit -m \"init: 个人笔记站\" git branch -M main git remote add origin https://github.com/<你的用户名>/<仓库名>.git git push -u origin main https://<你的用户名>.github.io/<仓库名>/ node tools/build.mjs git add -A && git commit -m \"notes: 新增 xxx\" git push cd site python -m http.server 8080 # 打开 http://127.0.0.1:8080 npx serve site \u0001 GitHub 部署 命令 踩坑 \u0001 工具链 \u0001 ","attachments":[],"cover":{"ink":"#4C7DF0","soft":"#E9EFFE","glyph":"GI"},"ba           <button type="button" data-view="graph" role="tab">图谱</button>
        </div>
        <div class="segmented tiny" id="listToggle" aria-label="网格或列表视图">
          <button type="button" data-list="grid" class="on" title="网格视图" aria-label="网格视图">▦</button>
          <button type="button" data-list="list" title="列表视图" aria-label="列表视图">☰</button>
        </div>
        <button class="icon-btn" id="layoutBtn" type="button" title="切换排版风格（极简 / 技术 / 杂志）" aria-label="切换排版">🎨</button>
        <button class="icon-btn" id="themeBtn" type="button" title="切换深浅色" aria-label="切换主题">🌗</button>
      </div>
    </header>

    <div class="content" id="content">
      <div class="loading" id="loading"><div class="spinner"></div>正在载入资料库…</div>

      <!-- 资料库 -->
      <section class="view" id="view-home" aria-label="资料库">
        <div class="lib">
          <div class="lib-head">
            <div class="lib-head-main">
              <h1 id="heroTitle">资料库</h1>
              <p class="lib-sub" id="heroDesc">把 Markdown 丢进 content/，构建一次，这里就是你的笔记本架。</p>
            </div>
            <div class="lib-stats" id="stats"></div>
          </div>
          <div id="homeBody"></div>
        </div>
      </section>

      <!-- 笔记本（正文） -->
      <section class="view" id="view-note" aria-label="笔记正文">
        <div class="reader">
          <article class="article" id="article"></article>
          <aside class="toc" id="toc" aria-label="本页目录"></aside>
        </div>
      </section>

      <!-- 时间线 -->
      <section class="view" id="view-timeline" aria-label="时间线">
        <div class="lib">
          <div class="lib-head">
            <div class="lib-head-main">
              <h1>时间线</h1>
              <p class="lib-sub">按更新时间倒序排列，一眼看到最近在想什么。</p>
            </div>
          </div>
          <div id="timelineBody"></div>
        </div>
      </section>

      <!-- 知识图谱 -->
      <section class="view" id="view-graph" aria-label="知识图谱">
        <div class="lib">
          <div class="lib-head">
            <div class="lib-head-main">
              <h1>知识图谱</h1>
              <p class="lib-sub">节点＝笔记，颜色＝分类，连线＝互链（<code class="md-inline-code">[[双链]]</code>）或同标签。可拖动整理、滚轮缩放。</p>
            </div>
          </div>
          <div class="graph-wrap">
            <canvas id="graph"></canvas>
            <div class="graph-legend" id="graphLegend"></div>
            <div class="graph-tip" id="graphTip"></div>
            <div class="graph-tools">
              <button class="icon-btn" id="graphCenter" type="button" title="回到中心">⌖</button>
            </div>
          </div>
        </div>
      </section>

      <!-- 搜索结果 -->
      <section class="view" id="view-search" aria-label="搜索结果">
        <div class="lib">
          <div class="lib-head">
            <div class="lib-head-main">
              <h1 id="searchHead">搜索结果</h1>
              <p class="lib-sub" id="searchSub"></p>
            </div>
          </div>
          <div class="search-results" id="searchResults"></div>
        </div>
      </section>
    </div>
  </main>
</div>

<!-- 新建笔记：模板面板 -->
<div class="sheet" id="newSheet" role="dialog" aria-modal="true" aria-label="新建笔记">
  <div class="sheet-mask" data-close="1"></div>
  <div class="sheet-body">
    <div class="sheet-head">
      <h3>新建笔记</h3>
      <button class="icon-btn round" data-close="1" aria-label="关闭">✕</button>
    </div>
    <p class="sheet-desc">复制模板 → 存成 <code class="md-inline-code">content/你的文件名.md</code> → 运行 <code class="md-inline-code">node tools/update.mjs</code>，它就会作为一本新笔记出现在资料库里。</p>
    <div class="template-list" id="templateList"></div>
  </div>
</div>

<!-- 速览浮层 -->
<div class="quicklook" id="quicklook" role="dialog" aria-modal="true" aria-label="笔记速览">
  <div class="ql-mask" data-close="1"></div>
  <div class="ql-body" id="qlBody"></div>
</div>

<!-- 右键 / 长按菜单 -->
<div class="ctxmenu" id="ctxMenu" role="menu"></div>

<div class="scrim" id="scrim"></div>
<button class="to-top" id="toTop" type="button" aria-label="回到顶部">↑</button>

<div class="lightbox" id="lightbox" role="dialog" aria-label="图片预览">
  <button class="lightbox-close" id="lightboxClose" type="button" aria-label="关闭">✕</button>
  <img id="lightboxImg" alt="">
</div>


<script type="module" src="js/app.js?v=3"></script>
</body>
</html>
