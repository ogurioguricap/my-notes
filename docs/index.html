<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-layout="minimal">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>我的笔记</title>
<meta name="description" content="纯前端个人笔记站：搜索、目录、知识图谱、时间线，手机/平板/电脑都能看。">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%233b6ef5'/><path d='M9 23V9h2.6l4.4 7 4.4-7H23v14h-2.6v-9.2L16 20.6l-4.4-6.8V23z' fill='white'/></svg>">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%233b6ef5'/></svg>">

<!-- 公式渲染（KaTeX）：数模笔记必备；离线时自动降级为可读文本 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" crossorigin="anonymous">
<script>
  // 首屏不为公式样式阻塞：异步加载 KaTeX 样式表
  (function () {
    var l = document.createElement('link');
    l.rel = 'stylesheet';
    l.href = 'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css';
    l.crossOrigin = 'anonymous';
    l.onerror = function () { document.documentElement.dataset.katex = 'failed'; };
    document.head.appendChild(l);
  })();
</script>
<link rel="stylesheet" href="css/style.css">
<script>
  // 提前应用主题，避免白屏闪烁
  (function () {
    try {
      var t = localStorage.getItem('note-theme') || 'system';
      var l = localStorage.getItem('note-layout') || 'minimal';
      var m = window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.theme = t === 'system' ? (m ? 'dark' : 'light') : t;
      document.documentElement.dataset.layout = l;
    } catch (e) {}
  })();
</script>
</head>
<body>
<div class="progress-bar" id="progress"></div>

<div class="app">
  <!-- ===================== 侧边栏 ===================== -->
  <aside class="sidebar" id="sidebar" aria-label="笔记导航">
    <div class="sidebar-head">
      <a class="brand" href="#/" aria-label="回到首页">
        <span class="brand-logo">M</span>
        <span class="brand-text">
          <span class="brand-title" id="siteTitle">我的笔记</span>
          <span class="brand-sub" id="siteSub">本地优先 · 纯前端</span>
        </span>
      </a>
    </div>

    <div class="search">
      <span class="search-icon" aria-hidden="true">⌕</span>
      <input class="search-input" id="searchInput" type="search" placeholder="搜索标题 / 正文 / 图表文字…"
             autocomplete="off" spellcheck="false" aria-label="搜索笔记">
      <button class="search-clear" id="searchClear" type="button" aria-label="清空搜索">✕</button>
    </div>

    <div class="side-filters" id="catFilters"></div>

    <nav class="side-scroll" id="noteList" aria-label="笔记列表"></nav>

    <div class="side-foot">
      <span id="footStats">加载中…</span>
      <span title="搜索快捷键">⌘/Ctrl + <span class="kbd">K</span></span>
    </div>
  </aside>

  <!-- ===================== 主区 ===================== -->
  <main class="main">
    <header class="topbar">
      <div class="topbar-left">
        <button class="icon-btn" id="menuBtn" type="button" aria-label="打开目录">☰</button>
        <span class="breadcrumb" id="breadcrumb">首页</span>
      </div>
      <div class="topbar-right">
        <div class="viewswitch" role="tablist" aria-label="视图切换">
          <button type="button" data-view="home" class="on" role="tab">🏠 <span class="lbl">首页</span></button>
          <button type="button" data-view="timeline" role="tab">🕒 <span class="lbl">时间线</span></button>
          <button type="button" data-view="graph" role="tab">🕸 <span class="lbl">知识图谱</span></button>
        </div>
        <button class="icon-btn wide" id="layoutBtn" type="button" title="切换排版风格（极简 / 技术 / 杂志）">🎨 <span class="lbl" id="layoutLbl">极简</span></button>
        <button class="icon-btn" id="themeBtn" type="button" title="切换深浅色（浅 / 深 / 跟随系统）" aria-label="切换主题">🌗</button>
      </div>
    </header>

    <div class="content" id="content">
      <div class="loading" id="loading"><div class="spinner"></div>正在载入笔记…</div>

      <!-- 首页 -->
      <section class="view" id="view-home" aria-label="首页">
        <div class="reader" style="display:block">
          <div class="hero">
            <h1 id="heroTitle">我的笔记</h1>
            <p id="heroDesc">把整理好的内容丢进 <code class="md-inline-code">content/</code>，构建一次，这里就是你的知识库。</p>
            <div class="stats" id="stats"></div>
          </div>
          <div id="homeBody"></div>
        </div>
      </section>

      <!-- 文章 -->
      <section class="view" id="view-note" aria-label="笔记正文">
        <div class="reader">
          <article class="article" id="article"></article>
          <aside class="toc" id="toc" aria-label="本页目录"></aside>
        </div>
      </section>

      <!-- 时间线 -->
      <section class="view" id="view-timeline" aria-label="时间线">
        <div class="reader" style="display:block">
          <div class="hero" style="padding-bottom:0">
            <h1>时间线</h1>
            <p>按更新时间倒序排列，一眼看到最近在想什么。</p>
          </div>
          <div id="timelineBody"></div>
        </div>
      </section>

      <!-- 知识图谱 -->
      <section class="view" id="view-graph" aria-label="知识图谱">
        <div class="reader" style="display:block">
          <div class="hero" style="padding-bottom:12px">
            <h1>知识图谱</h1>
            <p>节点＝笔记，颜色＝分类，连线＝互链（<code class="md-inline-code">[[双链]]</code> 或同标签）。拖动可整理，滚轮缩放。</p>
          </div>
          <div class="graph-wrap">
            <canvas id="graph"></canvas>
            <div class="graph-legend" id="graphLegend"></div>
            <div class="graph-tip" id="graphTip"></div>
            <div class="graph-tools">
              <button class="icon-btn" id="graphCenter" type="button" title="回到中心">⌖</button>
            </div>
          </div>
        </div>
      </section>

      <!-- 搜索结果 -->
      <section class="view" id="view-search" aria-label="搜索结果">
        <div class="reader" style="display:block">
          <div class="hero" style="padding-bottom:10px">
            <h1 id="searchHead">搜索结果</h1>
            <p id="searchSub"></p>
          </div>
          <div class="search-results" id="searchResults"></div>
        </div>
      </section>
    </div>
  </main>
</div>

<div class="scrim" id="scrim"></div>
<button class="to-top" id="toTop" type="button" aria-label="回到顶部">↑</button>

<div class="lightbox" id="lightbox" role="dialog" aria-label="图片预览">
  <button class="lightbox-close" id="lightboxClose" type="button" aria-label="关闭">✕</button>
  <img id="lightboxImg" alt="">
</div>

<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" crossorigin="anonymous"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
